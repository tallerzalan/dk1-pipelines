# one-off: downloads dk2's history and runs the direction and spread backtests. start by hand

name: Imbalance DK2 backtest

on:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: imbalance-dk2

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true
          working-directory: imbalance-dk2

      - uses: r-lib/actions/setup-renv@v2
        with:
          working-directory: imbalance-dk2

      - name: Download history
        run: |
          mkdir -p data/raw data/processed
          Rscript scripts/01_download.R
          Rscript scripts/01b_download_realtime.R

      - name: Backtests
        run: |
          Rscript scripts/02_direction.R
          Rscript scripts/03_spread.R
          Rscript scripts/04_intraday.R
          Rscript scripts/04b_intraday_spread.R
          Rscript scripts/05_evaluate.R

      - name: Save the results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git commit -m "DK2 imbalance backtest $(date -u '+%F %H:%M') UTC" || echo "Nothing new to commit"
          for try in 1 2 3; do
            if git pull --rebase origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 20
          done
          exit 1
