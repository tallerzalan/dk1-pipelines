# daily dk2 price forecast, from price-dk2/. starts when the dk1 price forecast finishes, so the same outside
# scheduler drives both, and has its own cron attempts as a backup. the gate lets one run through a day, before the auction

name: Price forecast DK2

on:
  workflow_run:
    workflows: ["Price forecast"]
    types: [completed]
  schedule:
    - cron: "10,40 9 * * *"
    - cron: "10,40 10 * * *"
  workflow_dispatch:
    inputs:
      scheduled:
        description: "Same checks as a scheduled run"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: price-dk2
  cancel-in-progress: false

defaults:
  run:
    working-directory: price-dk2

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - id: check
        run: |
          now=$(TZ=Europe/Copenhagen date +%H%M)
          target=$(TZ=Europe/Copenhagen date -d tomorrow +%F)
          if [ "${{ github.event_name != 'workflow_dispatch' || inputs.scheduled }}" != "true" ]; then go=true
          elif [ ! -f results/backtest_forecasts.csv ]; then go=false
          elif [ "$now" -lt 1000 ]; then go=false
          elif [ "$now" -ge 1145 ]; then go=false
          elif grep -q ",$target," forecasts/forecasts_live.csv; then go=false
          else go=true; fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "danish time $now, forecast for $target: run = $go"

  forecast:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true
          working-directory: price-dk2

      - uses: r-lib/actions/setup-renv@v2
        with:
          working-directory: price-dk2

      - name: Update prices, neighbour prices and weather
        run: Rscript scripts/01_update_live.R

      - name: Forecast tomorrow
        run: Rscript scripts/05_forecast_tomorrow.R

      # the python rewrite runs beside r, into its own log, until it has matched r for long enough to take over
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Python forecast, alongside R
        continue-on-error: true   # r's forecast is the one that counts for now
        run: |
          pip install -q -e ../python
          python -m dkfc forecast --zone DK2 --folder . --log forecasts/forecasts_python.csv

      - name: Evaluate forecasts and battery
        continue-on-error: true   # the forecast is saved anyway
        run: |
          Rscript scripts/10_evaluate.R
          Rscript scripts/11_battery.R
          Rscript scripts/12_battery_risk.R

      - name: Save forecast and results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecasts/forecasts_live.csv forecasts/forecasts_python.csv live/ results/
          target=$(TZ=Europe/Copenhagen date -d tomorrow +%F)
          git commit -m "DK2 forecast for delivery day $target, made $(date -u '+%F %H:%M') UTC" || echo "Nothing new to commit"
          for try in 1 2 3; do
            if git pull --rebase origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 20
          done
          exit 1
