# one-off: the day-ahead to imbalance backtest. start by hand after the dk2 price backtest, which it reads

name: Imbalance DK2 paper backtest

on:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: imbalance-dk2

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      LANG: C.UTF-8
      PRICE_REPO: https://raw.githubusercontent.com/${{ github.repository }}/main/price-dk2/
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true
          working-directory: imbalance-dk2

      - uses: r-lib/actions/setup-renv@v2
        with:
          working-directory: imbalance-dk2

      - name: Download history
        run: Rscript scripts/01_download.R

      - name: Backtest
        run: Rscript scripts/06_dayahead_to_imbalance.R

      - name: Save the results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git commit -m "DK2 paper test backtest $(date -u '+%F %H:%M') UTC" || echo "Nothing new to commit"
          for try in 1 2 3; do
            if git pull --rebase origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 20
          done
          exit 1
